services:
  app:
#    image: security-service-image
    build: .
    container_name: educontrol-service
    ports:
      - "5555:5555"
    restart: always
    environment:
      - TZ=Asia/Tashkent
      - JVM_OPTS=-Xmx512m -Xms256m
    command: [ "java", "-jar", "app.jar" ]
    networks:
      - test-hr-edu
networks:
  test-hr-edu:
    name: test-hr-edu
    external: true
